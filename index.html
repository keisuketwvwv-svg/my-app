<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資管理アプリ</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --nisa: #059669;
            --tokutei: #d97706;
            --gain: #059669;
            --loss: #dc2626;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --r: 14px;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ── Header ── */
        .header {
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        .header h1 { font-size: 18px; font-weight: 700; }
        .header-date { font-size: 12px; opacity: 0.75; }

        /* ── Main ── */
        main {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Portfolio Summary Card ── */
        .portfolio-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            border-radius: var(--r);
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(37,99,235,0.3);
        }
        .section-label {
            font-size: 11px;
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .total-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            background: rgba(255,255,255,0.13);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .stat-item .stat-label { font-size: 11px; opacity: 0.72; margin-bottom: 3px; }
        .stat-item .stat-value { font-size: 16px; font-weight: 700; }
        .stat-item .stat-value.gain { color: #6ee7b7; }
        .stat-item .stat-value.loss { color: #fca5a5; }

        /* ── Account Block ── */
        .account-block {
            margin-bottom: 16px;
            border-radius: var(--r);
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .account-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            color: white;
        }
        .account-head.nisa    { background: var(--nisa); }
        .account-head.tokutei { background: var(--tokutei); }
        .account-head h2 { font-size: 15px; font-weight: 700; }
        .account-head-right { text-align: right; font-size: 12px; }
        .acc-value { font-size: 15px; font-weight: 700; margin-bottom: 1px; }

        /* ── Fund List ── */
        .fund-list { background: var(--card); }

        .fund-item {
            padding: 14px;
            border-bottom: 1px solid var(--border);
        }
        .fund-item:last-child { border-bottom: none; }

        .fund-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .fund-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.45;
            flex: 1;
            margin-right: 10px;
        }
        .fund-buttons { display: flex; gap: 6px; flex-shrink: 0; }

        .btn-sm {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-sm:active { opacity: 0.65; }
        .btn-edit-sm { background: #eff6ff; color: var(--primary); }
        .btn-del-sm  { background: #fef2f2; color: var(--loss); }

        .fund-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        .data-cell {
            background: var(--bg);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .data-cell .cell-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .data-cell .cell-value { font-size: 13px; font-weight: 600; }

        .pnl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 10px;
            border-radius: 8px;
        }
        .pnl-row.gain { background: #f0fdf4; }
        .pnl-row.loss { background: #fef2f2; }
        .pnl-row.zero { background: var(--bg); }
        .pnl-left { font-size: 12px; color: var(--text-muted); }
        .pnl-right { font-size: 15px; font-weight: 800; }
        .pnl-right.gain { color: var(--gain); }
        .pnl-right.loss { color: var(--loss); }
        .pnl-right.zero { color: var(--text-muted); }
        .pnl-rate { font-size: 12px; font-weight: 600; margin-left: 4px; }
        .pnl-rate.gain { color: var(--gain); }
        .pnl-rate.loss { color: var(--loss); }
        .pnl-rate.zero { color: var(--text-muted); }

        /* ── Empty State ── */
        .empty {
            background: var(--card);
            padding: 28px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Price Update Table ── */
        .price-section {
            background: var(--card);
            border-radius: var(--r);
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .price-section.hidden { display: none; }

        .price-sec-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .price-sec-title { font-size: 14px; font-weight: 700; }
        .last-updated { font-size: 11px; color: var(--text-muted); }

        .price-tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        .price-tbl {
            width: 100%;
            border-collapse: collapse;
            min-width: 300px;
        }
        .price-tbl th {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: left;
            padding: 7px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .price-tbl th:last-child { text-align: right; }
        .price-tbl td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .price-tbl tr:last-child td { border-bottom: none; }

        .pt-name-text {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 5px;
        }
        .pt-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .pt-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            flex-shrink: 0;
        }
        .pt-badge.nisa    { background: var(--nisa); }
        .pt-badge.tokutei { background: var(--tokutei); }

        .pt-yahoo {
            font-size: 10px;
            color: var(--primary);
            text-decoration: none;
            white-space: nowrap;
        }
        .pt-yahoo:active { opacity: 0.65; }

        .price-inp {
            width: 100%;
            min-width: 84px;
            padding: 9px 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            background: var(--bg);
            font-family: inherit;
            text-align: right;
            transition: border-color 0.15s, background 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }
        .price-inp:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .pt-pnl-col { text-align: right; }
        .pt-pnl  { font-size: 13px; font-weight: 800; display: block; white-space: nowrap; }
        .pt-rate { font-size: 11px; font-weight: 600; display: block; margin-top: 1px; white-space: nowrap; }
        .pt-pnl.gain,  .pt-rate.gain  { color: var(--gain); }
        .pt-pnl.loss,  .pt-rate.loss  { color: var(--loss); }
        .pt-pnl.zero,  .pt-rate.zero  { color: var(--text-muted); }

        /* ── FAB ── */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37,99,235,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            font-family: inherit;
            line-height: 1;
        }
        .fab:active { transform: scale(0.93); }

        /* ── Bottom Sheet Modal ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: flex-end;
        }
        .overlay.hidden { display: none; }

        .sheet {
            background: white;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            padding: 12px 16px 48px;
            max-height: 95vh;
            overflow-y: auto;
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 16px;
        }
        .sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

        /* ── Form ── */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field input,
        .field select {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            color: var(--text);
            background: white;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.15s;
        }
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .field .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        /* ── Preview Box ── */
        .preview {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .preview.hidden { display: none; }
        .preview-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .preview-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .preview-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            margin-top: 3px;
            border-top: 1px solid var(--border);
            font-size: 15px;
            font-weight: 700;
        }

        /* ── Buttons ── */
        .btn-save {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-save:active { background: var(--primary-dark); }

        .btn-cancel {
            display: block;
            width: 100%;
            padding: 15px;
            background: none;
            color: var(--text-muted);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
        }

        /* ── Action Bar ── */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn-action {
            flex: 1;
            padding: 11px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: opacity 0.15s, transform 0.1s;
            line-height: 1.2;
        }
        .btn-action:active { opacity: 0.65; transform: scale(0.96); }
        .btn-action .btn-icon-lg { font-size: 18px; }
        .btn-save-act  { background: #eff6ff; color: var(--primary); }
        .btn-csv-act   { background: #f0fdf4; color: #047857; }
        .btn-reset-act { background: #fef2f2; color: var(--loss); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 96px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: #1e293b;
            color: white;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.22s, transform 0.22s;
            z-index: 300;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Charts ── */
        .charts-section { margin-bottom: 16px; }
        .charts-section.hidden { display: none; }

        .charts-head {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            padding: 0 2px;
        }

        .chart-card {
            background: var(--card);
            border-radius: var(--r);
            padding: 14px 14px 18px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .chart-card:last-child { margin-bottom: 0; }

        .chart-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }

        .chart-pie-wrap {
            max-width: 260px;
            margin: 0 auto;
        }

        .chart-bar-wrap {
            position: relative;
            min-height: 120px;
        }
    </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
    <h1>📈 投資管理</h1>
    <span class="header-date" id="headerDate"></span>
</div>

<!-- ── Main ── -->
<main>

    <!-- Portfolio Summary -->
    <div class="portfolio-card">
        <div class="section-label">総評価額</div>
        <div class="total-value" id="summaryTotalValue">¥0</div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">総取得額</div>
                <div class="stat-value" id="summaryTotalCost">¥0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">トータル損益</div>
                <div class="stat-value" id="summaryTotalPnL">¥0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">トータルリターン</div>
                <div class="stat-value" id="summaryTotalReturn">0.00%</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">保有銘柄数</div>
                <div class="stat-value" id="summaryCount">0本</div>
            </div>
        </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <button class="btn-action btn-save-act" id="btnSaveData">
            <span class="btn-icon-lg">💾</span>保存
        </button>
        <button class="btn-action btn-csv-act" id="btnExportCSV">
            <span class="btn-icon-lg">📥</span>CSV出力
        </button>
        <button class="btn-action btn-reset-act" id="btnReset">
            <span class="btn-icon-lg">🗑️</span>リセット
        </button>
    </div>

    <!-- Price Update Table -->
    <div class="price-section hidden" id="priceSection">
        <div class="price-sec-head">
            <span class="price-sec-title">💹 現在価格を更新</span>
            <span class="last-updated" id="lastUpdated">未更新</span>
        </div>
        <div class="price-tbl-wrap">
            <table class="price-tbl">
                <thead>
                    <tr>
                        <th>銘柄</th>
                        <th>現在価格（円/万口）</th>
                        <th>損益</th>
                    </tr>
                </thead>
                <tbody id="priceTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Charts -->
    <section class="charts-section hidden" id="chartsSection">
        <div class="charts-head">グラフ</div>

        <div class="chart-card">
            <div class="chart-title">銘柄別 保有割合</div>
            <div class="chart-pie-wrap">
                <canvas id="chartFundPie"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-title">口座別 資産比率（NISA・特定）</div>
            <div class="chart-pie-wrap">
                <canvas id="chartAccountPie"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-title">銘柄別 損益</div>
            <div class="chart-bar-wrap" id="chartBarWrap">
                <canvas id="chartPnLBar"></canvas>
            </div>
        </div>
    </section>

    <!-- NISA口座 -->
    <div class="account-block">
        <div class="account-head nisa">
            <h2>🌱 NISA口座</h2>
            <div class="account-head-right" id="nisaHeadRight">
                <div class="acc-value">¥0</div>
                <div>損益: ¥0</div>
            </div>
        </div>
        <div class="fund-list" id="nisaList"></div>
    </div>

    <!-- 特定口座 -->
    <div class="account-block">
        <div class="account-head tokutei">
            <h2>📊 特定口座</h2>
            <div class="account-head-right" id="tokuteiHeadRight">
                <div class="acc-value">¥0</div>
                <div>損益: ¥0</div>
            </div>
        </div>
        <div class="fund-list" id="tokuteiList"></div>
    </div>

</main>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── FAB ── -->
<button class="fab" id="fabAdd" title="銘柄を追加">+</button>

<!-- ── Bottom Sheet Modal ── -->
<div class="overlay hidden" id="overlay">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <h2 id="sheetTitle">銘柄を追加</h2>

        <div class="field">
            <label>銘柄名</label>
            <input type="text" id="inpName" placeholder="例: eMAXIS Slim 全世界株式（オール・カントリー）">
        </div>

        <div class="field">
            <label>口座種別</label>
            <div class="select-wrap">
                <select id="inpAccount">
                    <option value="NISA">NISA口座</option>
                    <option value="特定">特定口座</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>保有口数（口）</label>
            <input type="number" id="inpQty" placeholder="例: 1000000" min="0">
            <div class="hint">例: 100万口 → 1000000</div>
        </div>

        <div class="field">
            <label>取得単価（円 / 1万口）</label>
            <input type="number" id="inpAcq" placeholder="例: 15000" min="0" step="1">
            <div class="hint">1万口あたりの基準価額（購入時）</div>
        </div>

        <div class="field">
            <label>現在基準価額（円 / 1万口）</label>
            <input type="number" id="inpCur" placeholder="例: 20000" min="0" step="1">
            <div class="hint">1万口あたりの現在の基準価額</div>
        </div>

        <!-- Calculation Preview -->
        <div class="preview hidden" id="preview">
            <div class="preview-title">計算プレビュー</div>
            <div class="preview-row">
                <span>取得金額</span>
                <span id="pvCost">¥0</span>
            </div>
            <div class="preview-row">
                <span>現在評価額</span>
                <span id="pvValue">¥0</span>
            </div>
            <div class="preview-row">
                <span>損益</span>
                <span id="pvPnL">¥0</span>
            </div>
        </div>

        <button class="btn-save" id="btnSave">保存する</button>
        <button class="btn-cancel" id="btnCancel">キャンセル</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2/encoding.min.js"></script>
<script>
'use strict';

const STORAGE_KEY = 'tokushi_portfolio_v1';

// ── State ──────────────────────────────────────────────────────────────────
let funds = [];
let editId = null;

// ── Chart Instances ────────────────────────────────────────────────────────
const PALETTE = [
    '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
    '#ec4899','#06b6d4','#84cc16','#f97316','#6366f1','#14b8a6','#a855f7'
];
const CHART_FONT = "-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif";
let chartFundPie = null, chartAccountPie = null, chartPnLBar = null;

// ── Helpers ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const yen    = n => '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
const pnlStr = n => (n >= 0 ? '+' : '-') + yen(n);
const rateStr = r => (r >= 0 ? '+' : '') + r.toFixed(2) + '%';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function calcFund(f) {
    const cost  = (f.qty * f.acq) / 10000;
    const value = (f.qty * f.cur) / 10000;
    const pnl   = value - cost;
    const rate  = cost > 0 ? (pnl / cost) * 100 : 0;
    return { cost, value, pnl, rate };
}

// ── Persistence ────────────────────────────────────────────────────────────
function load() {
    try { funds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { funds = []; }
}

function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(funds));
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
    renderSummary();
    renderPriceTable();
    renderAccount('NISA', 'nisaList',    'nisaHeadRight');
    renderAccount('特定', 'tokuteiList', 'tokuteiHeadRight');
    renderCharts();
}

function renderSummary() {
    let totalCost = 0, totalValue = 0;
    funds.forEach(f => {
        const { cost, value } = calcFund(f);
        totalCost  += cost;
        totalValue += value;
    });
    const pnl  = totalValue - totalCost;
    const rate = totalCost > 0 ? (pnl / totalCost) * 100 : 0;

    $('summaryTotalValue').textContent = yen(totalValue);
    $('summaryTotalCost').textContent  = yen(totalCost);

    const pnlEl = $('summaryTotalPnL');
    pnlEl.textContent = pnlStr(pnl);
    pnlEl.className   = 'stat-value ' + (pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : '');

    const retEl = $('summaryTotalReturn');
    retEl.textContent = rateStr(rate);
    retEl.className   = 'stat-value ' + (rate > 0 ? 'gain' : rate < 0 ? 'loss' : '');

    $('summaryCount').textContent = funds.length + '本';
}

function renderAccount(acType, listId, headRightId) {
    const af = funds.filter(f => f.account === acType);
    let acCost = 0, acValue = 0;
    af.forEach(f => {
        const { cost, value } = calcFund(f);
        acCost  += cost;
        acValue += value;
    });
    const acPnL  = acValue - acCost;
    const acRate = acCost > 0 ? (acPnL / acCost) * 100 : 0;
    const pnlColor = acPnL > 0 ? '#6ee7b7' : acPnL < 0 ? '#fca5a5' : 'rgba(255,255,255,0.75)';

    $(headRightId).innerHTML = `
        <div class="acc-value">${yen(acValue)}</div>
        <div style="color:${pnlColor}">損益: ${pnlStr(acPnL)} (${rateStr(acRate)})</div>`;

    const listEl = $(listId);
    if (af.length === 0) {
        listEl.innerHTML = `<div class="empty">${acType}口座の銘柄がありません</div>`;
        return;
    }

    listEl.innerHTML = af.map(f => {
        const { cost, value, pnl, rate } = calcFund(f);
        const cls = pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : 'zero';
        return `
        <div class="fund-item">
            <div class="fund-top">
                <div class="fund-name">${esc(f.name)}</div>
                <div class="fund-buttons">
                    <button class="btn-sm btn-edit-sm" onclick="openEdit('${f.id}')">編集</button>
                    <button class="btn-sm btn-del-sm"  onclick="deleteFund('${f.id}')">削除</button>
                </div>
            </div>
            <div class="fund-data">
                <div class="data-cell">
                    <div class="cell-label">保有口数</div>
                    <div class="cell-value">${f.qty.toLocaleString()}口</div>
                </div>
                <div class="data-cell">
                    <div class="cell-label">現在基準価額</div>
                    <div class="cell-value">¥${f.cur.toLocaleString()}/万口</div>
                </div>
                <div class="data-cell">
                    <div class="cell-label">取得金額</div>
                    <div class="cell-value">${yen(cost)}</div>
                </div>
                <div class="data-cell">
                    <div class="cell-label">現在評価額</div>
                    <div class="cell-value">${yen(value)}</div>
                </div>
            </div>
            <div class="pnl-row ${cls}">
                <span class="pnl-left">損益</span>
                <div>
                    <span class="pnl-right ${cls}">${pnlStr(pnl)}</span>
                    <span class="pnl-rate ${cls}">(${rateStr(rate)})</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── Price Update Table ─────────────────────────────────────────────────────
const LAST_UPDATED_KEY = 'tokushi_price_updated_v1';
const pad2 = n => String(n).padStart(2, '0');

function stampPriceUpdated() {
    localStorage.setItem(LAST_UPDATED_KEY, new Date().toISOString());
    renderLastUpdated();
}

function renderLastUpdated() {
    const iso = localStorage.getItem(LAST_UPDATED_KEY);
    const el = $('lastUpdated');
    if (!el) return;
    if (!iso) { el.textContent = '未更新'; return; }
    const d = new Date(iso);
    el.textContent = `更新: ${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function renderPriceTable() {
    const section = $('priceSection');
    if (funds.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    $('priceTableBody').innerHTML = funds.map(f => {
        const { pnl, rate } = calcFund(f);
        const cls   = pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : 'zero';
        const acCls = f.account === 'NISA' ? 'nisa' : 'tokutei';
        const yahoo = `https://finance.yahoo.co.jp/search/?query=${encodeURIComponent(f.name)}`;
        return `
        <tr>
            <td>
                <div class="pt-name-text">${esc(f.name)}</div>
                <div class="pt-meta">
                    <span class="pt-badge ${acCls}">${esc(f.account)}</span>
                    <a class="pt-yahoo" href="${yahoo}" target="_blank" rel="noopener noreferrer">Yahoo!ファイナンス ↗</a>
                </div>
            </td>
            <td>
                <input class="price-inp" type="text" inputmode="decimal"
                       value="${f.cur}" data-id="${f.id}" autocomplete="off" autocorrect="off">
            </td>
            <td class="pt-pnl-col">
                <span class="pt-pnl ${cls}"  id="pt-pnl-${f.id}">${pnlStr(pnl)}</span>
                <span class="pt-rate ${cls}" id="pt-rate-${f.id}">(${rateStr(rate)})</span>
            </td>
        </tr>`;
    }).join('');

    renderLastUpdated();
}

// Debounced partial re-render (skips price table to preserve input focus)
let _priceRenderTimer = null;
function schedulePartialRender() {
    clearTimeout(_priceRenderTimer);
    _priceRenderTimer = setTimeout(() => {
        renderSummary();
        renderAccount('NISA', 'nisaList',    'nisaHeadRight');
        renderAccount('特定', 'tokuteiList', 'tokuteiHeadRight');
        renderCharts();
    }, 400);
}

// ── Charts ─────────────────────────────────────────────────────────────────
function renderCharts() {
    const section = $('chartsSection');
    if (funds.length === 0) {
        section.classList.add('hidden');
        [chartFundPie, chartAccountPie, chartPnLBar].forEach(c => c && c.destroy());
        chartFundPie = chartAccountPie = chartPnLBar = null;
        return;
    }
    section.classList.remove('hidden');

    const legendLabels = (size) => ({
        font: { size, family: CHART_FONT },
        padding: 10,
        boxWidth: 12,
        color: '#0f172a'
    });
    const pctTooltip = ctx => {
        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
        const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : '0.0';
        return ` ${yen(ctx.raw)}（${pct}%）`;
    };
    const doughnutOpts = (legendSize = 11) => ({
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
            legend: { position: 'bottom', labels: legendLabels(legendSize) },
            tooltip: { callbacks: { label: pctTooltip } }
        }
    });

    // ── 銘柄別 保有割合（ドーナツ）──
    const fundLabels = funds.map(f => f.name.length > 15 ? f.name.slice(0, 15) + '…' : f.name);
    const fundValues = funds.map(f => Math.round(calcFund(f).value));

    if (chartFundPie) chartFundPie.destroy();
    chartFundPie = new Chart($('chartFundPie'), {
        type: 'doughnut',
        data: {
            labels: fundLabels,
            datasets: [{
                data: fundValues,
                backgroundColor: PALETTE.slice(0, funds.length),
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: doughnutOpts(11)
    });

    // ── 口座別 資産比率（ドーナツ）──
    const nisaVal    = funds.filter(f => f.account === 'NISA').reduce((s, f) => s + calcFund(f).value, 0);
    const tokuteiVal = funds.filter(f => f.account === '特定').reduce((s, f) => s + calcFund(f).value, 0);

    if (chartAccountPie) chartAccountPie.destroy();
    chartAccountPie = new Chart($('chartAccountPie'), {
        type: 'doughnut',
        data: {
            labels: ['NISA口座', '特定口座'],
            datasets: [{
                data: [Math.round(nisaVal), Math.round(tokuteiVal)],
                backgroundColor: ['#059669', '#d97706'],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: doughnutOpts(12)
    });

    // ── 銘柄別 損益（横棒グラフ）──
    const pnlValues  = funds.map(f => Math.round(calcFund(f).pnl));
    const barLabels  = funds.map(f => f.name.length > 14 ? f.name.slice(0, 14) + '…' : f.name);
    const barBg      = pnlValues.map(v => v >= 0 ? 'rgba(37,99,235,0.82)'  : 'rgba(220,38,38,0.82)');
    const barBorder  = pnlValues.map(v => v >= 0 ? '#1d4ed8' : '#b91c1c');

    const barHeight = Math.max(140, funds.length * 52);
    $('chartBarWrap').style.height = barHeight + 'px';

    if (chartPnLBar) chartPnLBar.destroy();
    chartPnLBar = new Chart($('chartPnLBar'), {
        type: 'bar',
        data: {
            labels: barLabels,
            datasets: [{
                data: pnlValues,
                backgroundColor: barBg,
                borderColor: barBorder,
                borderWidth: 1,
                borderRadius: 4,
                borderSkipped: false
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: { label: ctx => ` ${pnlStr(ctx.raw)}` }
                }
            },
            scales: {
                x: {
                    grid: { color: '#e2e8f0' },
                    border: { color: '#cbd5e1' },
                    ticks: {
                        font: { size: 11, family: CHART_FONT },
                        color: '#64748b',
                        maxTicksLimit: 6,
                        callback: v => {
                            const a = Math.abs(v);
                            if (a >= 1000000) return (v / 1000000).toFixed(1) + 'M';
                            if (a >= 10000)   return (v / 10000).toFixed(0) + '万';
                            return v.toLocaleString('ja-JP');
                        }
                    }
                },
                y: {
                    grid: { display: false },
                    border: { color: '#cbd5e1' },
                    ticks: { font: { size: 11, family: CHART_FONT }, color: '#374151' }
                }
            }
        }
    });
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openAdd() {
    editId = null;
    $('sheetTitle').textContent = '銘柄を追加';
    $('inpName').value    = '';
    $('inpAccount').value = 'NISA';
    $('inpQty').value     = '';
    $('inpAcq').value     = '';
    $('inpCur').value     = '';
    $('preview').classList.add('hidden');
    $('overlay').classList.remove('hidden');
    setTimeout(() => $('inpName').focus(), 100);
}

function openEdit(id) {
    const f = funds.find(f => f.id === id);
    if (!f) return;
    editId = id;
    $('sheetTitle').textContent = '銘柄を編集';
    $('inpName').value    = f.name;
    $('inpAccount').value = f.account;
    $('inpQty').value     = f.qty;
    $('inpAcq').value     = f.acq;
    $('inpCur').value     = f.cur;
    updatePreview();
    $('overlay').classList.remove('hidden');
}

function closeModal() {
    $('overlay').classList.add('hidden');
    editId = null;
}

function updatePreview() {
    const qty = parseFloat($('inpQty').value) || 0;
    const acq = parseFloat($('inpAcq').value) || 0;
    const cur = parseFloat($('inpCur').value) || 0;
    const prev = $('preview');
    if (!qty || !acq || !cur) { prev.classList.add('hidden'); return; }

    const cost  = (qty * acq) / 10000;
    const value = (qty * cur) / 10000;
    const pnl   = value - cost;
    const rate  = cost > 0 ? (pnl / cost) * 100 : 0;

    prev.classList.remove('hidden');
    $('pvCost').textContent  = yen(cost);
    $('pvValue').textContent = yen(value);
    const pvPnL = $('pvPnL');
    pvPnL.textContent = `${pnlStr(pnl)}  (${rateStr(rate)})`;
    pvPnL.style.color = pnl > 0 ? '#059669' : pnl < 0 ? '#dc2626' : '#64748b';
}

function saveFund() {
    const name    = $('inpName').value.trim();
    const account = $('inpAccount').value;
    const qty     = parseFloat($('inpQty').value);
    const acq     = parseFloat($('inpAcq').value);
    const cur     = parseFloat($('inpCur').value);

    if (!name)             { alert('銘柄名を入力してください'); $('inpName').focus(); return; }
    if (!qty || qty <= 0)  { alert('保有口数を正しく入力してください'); return; }
    if (!acq || acq <= 0)  { alert('取得単価を正しく入力してください'); return; }
    if (!cur || cur <= 0)  { alert('現在基準価額を正しく入力してください'); return; }

    if (editId) {
        const i = funds.findIndex(f => f.id === editId);
        if (i !== -1) funds[i] = { ...funds[i], name, account, qty, acq, cur };
    } else {
        funds.push({ id: uid(), name, account, qty, acq, cur });
    }
    persist();
    render();
    closeModal();
}

function deleteFund(id) {
    const f = funds.find(f => f.id === id);
    if (!f) return;
    if (!confirm(`「${f.name}」を削除しますか？`)) return;
    funds = funds.filter(f => f.id !== id);
    persist();
    render();
}

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Save (explicit) ────────────────────────────────────────────────────────
function saveData() {
    persist();
    showToast('✓ 保存しました');
}

// ── Reset ──────────────────────────────────────────────────────────────────
function resetData() {
    if (!confirm('すべてのデータを初期化しますか？\nこの操作は元に戻せません。')) return;
    funds = [];
    persist();
    render();
    showToast('データをリセットしました');
}

// ── CSV Export ─────────────────────────────────────────────────────────────
function exportCSV() {
    if (funds.length === 0) { alert('エクスポートするデータがありません'); return; }

    const headers = [
        '銘柄名', '口座種別', '保有口数（口）',
        '取得単価（円/万口）', '現在基準価額（円/万口）',
        '取得金額（円）', '現在評価額（円）', '損益額（円）', '損益率（%）'
    ];

    const rows = funds.map(f => {
        const { cost, value, pnl, rate } = calcFund(f);
        return [
            f.name,
            f.account + '口座',
            f.qty,
            f.acq,
            f.cur,
            Math.round(cost),
            Math.round(value),
            Math.round(pnl),
            rate.toFixed(2)
        ];
    });

    const csv = [headers, ...rows]
        .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
        .join('\r\n');

    // Convert to Shift-JIS for Excel compatibility
    const sjis = Encoding.convert(Encoding.stringToCode(csv), { to: 'SJIS', from: 'UNICODE' });
    const blob = new Blob([new Uint8Array(sjis)], { type: 'text/csv;charset=shift-jis;' });

    const d = new Date();
    const dateStr = String(d.getFullYear())
        + String(d.getMonth() + 1).padStart(2, '0')
        + String(d.getDate()).padStart(2, '0');

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `投資管理_${dateStr}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);

    showToast('📥 CSVを出力しました');
}

// ── Date ───────────────────────────────────────────────────────────────────
function setDate() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    $('headerDate').textContent = `${y}/${m}/${day}`;
}

// ── Event Listeners ────────────────────────────────────────────────────────
$('btnSaveData').addEventListener('click', saveData);
$('btnExportCSV').addEventListener('click', exportCSV);
$('btnReset').addEventListener('click', resetData);
$('fabAdd').addEventListener('click', openAdd);

// ── Price table: auto-select on focus ──────────────────────────────────────
$('priceTableBody').addEventListener('focusin', e => {
    if (e.target.classList.contains('price-inp')) e.target.select();
});

// ── Price table: instant recalculation on input ────────────────────────────
$('priceTableBody').addEventListener('input', e => {
    if (!e.target.classList.contains('price-inp')) return;
    const input = e.target;
    const id    = input.dataset.id;

    // Strip ¥ signs, commas, spaces — allow digits and one decimal point
    const cleaned = input.value.replace(/[^0-9.]/g, '');
    if (cleaned !== input.value) {
        const pos = Math.max(0, input.selectionStart - (input.value.length - cleaned.length));
        input.value = cleaned;
        try { input.setSelectionRange(pos, pos); } catch (_) {}
    }

    const price = parseFloat(cleaned);
    if (!price || price <= 0) return;

    const f = funds.find(f => f.id === id);
    if (!f || f.cur === price) return;
    f.cur = price;
    persist();
    stampPriceUpdated();

    // Instantly update only this row's P&L cells
    const { pnl, rate } = calcFund(f);
    const cls   = pnl > 0 ? 'gain' : pnl < 0 ? 'loss' : 'zero';
    const pnlEl  = $('pt-pnl-'  + id);
    const rateEl = $('pt-rate-' + id);
    if (pnlEl)  { pnlEl.textContent  = pnlStr(pnl);              pnlEl.className  = 'pt-pnl '  + cls; }
    if (rateEl) { rateEl.textContent = '(' + rateStr(rate) + ')'; rateEl.className = 'pt-rate ' + cls; }

    schedulePartialRender();
});
$('btnSave').addEventListener('click', saveFund);
$('btnCancel').addEventListener('click', closeModal);
$('overlay').addEventListener('click', e => {
    if (e.target === $('overlay')) closeModal();
});
['inpQty', 'inpAcq', 'inpCur'].forEach(id => {
    $(id).addEventListener('input', updatePreview);
});

// ── Init ───────────────────────────────────────────────────────────────────
load();
setDate();
render();
</script>
