name: ドラクエウォーク攻略情報の自動取得

on:
  schedule:
    # 毎日 9:00 JST (= 0:00 UTC) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'デバッグモード（HTML を artifact に保存）'
        type: boolean
        default: false

jobs:
  fetch-dqwalk-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 接続テスト（ネットワーク疎通確認）
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          echo "=== Altema ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" \
            "https://altema.jp/dqwalk" || true
          echo "=== Game8 ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" \
            "https://game8.jp/dqwalk" || true

      - name: 攻略情報を取得
        id: fetch
        continue-on-error: true
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/fetch_dqwalk_guide.py --debug
          else
            python scripts/fetch_dqwalk_guide.py
          fi

      - name: 取得結果を表示
        if: always()
        run: |
          echo "=== fetch step outcome: ${{ steps.fetch.outcome }} ==="
          echo "=== dqwalk_guide.json の件数 ==="
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("dqwalk_guide.json")
          if not p.exists():
              print("dqwalk_guide.json が存在しません")
          else:
              d = json.loads(p.read_text())
              print(f"更新日時: {d.get('updated', '-')}")
              for src in d.get("sources", []):
                  print(f"  {src['source']}: {src['total_articles']} 件")
          EOF

      - name: デバッグ用 HTML を artifact に保存
        if: ${{ inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-dqwalk-html
          path: debug_dqwalk_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: dqwalk_guide.json をコミット・プッシュ
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dqwalk_guide.json
          if git diff --staged --quiet; then
            echo "dqwalk_guide.json に変更なし。コミットをスキップします。"
          else
            DATE=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "chore: ドラクエウォーク攻略情報を更新 ${DATE}"
            git push
          fi
