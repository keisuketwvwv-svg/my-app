name: 基準価額の自動取得

on:
  schedule:
    # 毎日 17:00 JST (= 08:00 UTC) に実行
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'デバッグモード（HTML を artifact に保存）'
        type: boolean
        default: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 接続テスト（ネットワーク疎通確認）
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          echo "=== モーニングスター ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" \
            "https://www.morningstar.co.jp/FundData/SnapShot.do?fnc=0331418A" || true
          echo "=== Yahoo Finance JP (stocks) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" \
            "https://stocks.finance.yahoo.co.jp/fund/detail/fund.html?code=0331418A" || true
          echo "=== みんかぶ ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -A "$UA" \
            "https://minkabu.jp/fund/0331418A" || true

      - name: 基準価額を取得
        id: fetch
        continue-on-error: true
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/fetch_prices.py --debug
          else
            python scripts/fetch_prices.py
          fi

      - name: 取得結果を表示
        if: always()
        run: |
          echo "=== fetch step outcome: ${{ steps.fetch.outcome }} ==="
          echo "=== prices.json の内容 ==="
          cat prices.json
          echo ""
          echo "=== モーニングスター HTML 診断 ==="
          python3 - <<'PYEOF'
import glob, re

for path in sorted(glob.glob("debug_*モーニングスター*.html"))[:1]:
    raw = open(path, "rb").read()
    print(f"ファイル: {path}")
    print(f"サイズ: {len(raw)} bytes")
    print(f"先頭バイト (hex): {raw[:20].hex()}")

    # エンコーディングを試す
    for enc in ("utf-8", "euc-jp", "shift-jis", "cp932"):
        try:
            html = raw.decode(enc)
            # 「基準価額」周辺100文字を表示
            m = re.search(r".{0,60}(?:基準価額|基準|価額).{0,120}", html)
            if m:
                print(f"\n[{enc}] 基準価額周辺: {m.group()!r}")
                break
            else:
                print(f"[{enc}] デコードOKだが「基準価額」が見つからず")
        except Exception as e:
            print(f"[{enc}] デコード失敗: {e}")

    # 数値パターン検索
    for enc in ("utf-8", "euc-jp", "shift-jis"):
        try:
            html = raw.decode(enc, errors="replace")
            nums = re.findall(r"\d{1,3}(?:,\d{3})+", html)
            print(f"\n[{enc}] ページ内の「X,XXX」形式の数値: {nums[:20]}")
            break
        except Exception:
            pass
PYEOF

      - name: デバッグ用 HTML を artifact に保存
        if: ${{ inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: prices.json をコミット・プッシュ
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "prices.json に変更なし。コミットをスキップします。"
          else
            DATE=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "chore: 基準価額を更新 ${DATE}"
            git push
          fi
