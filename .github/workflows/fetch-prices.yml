name: 基準価額の自動取得

on:
  schedule:
    # 毎日 17:00 JST (= 08:00 UTC) に実行
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'デバッグモード（HTML を artifact に保存）'
        type: boolean
        default: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # prices.json をコミットするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存ライブラリをインストール
        run: pip install requests

      - name: 基準価額を取得
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/fetch_prices.py --debug
          else
            python scripts/fetch_prices.py
          fi

      - name: デバッグ用 HTML を artifact に保存
        if: ${{ inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*.html
          retention-days: 3

      - name: prices.json をコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "prices.json に変更なし。コミットをスキップします。"
          else
            DATE=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "chore: 基準価額を更新 ${DATE}"
            git push
          fi
